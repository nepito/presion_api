services:
  develop:
    build:
      context: .
      dockerfile: Dockerfile
    image: nepolin/presion_api
    command: bash
    volumes:
      - $PWD:/workdir
  nies:
    image: nepolin/presion_api
    entrypoint: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - "6969:80"
    volumes:
      - $PWD:/workdir